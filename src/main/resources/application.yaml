server:
  port: 8081

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: loan-service
              uri: http://loanservice:8092
              predicates:
                - Path=/api/loan/**
            - id: account-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/accountdetails,/api/v1/accountdetails/**
          discovery:
            locator:
              enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.route: TRACE
    reactor.netty.http.client: DEBUG
