server:
  port: 8081

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      routes:
        - id: account-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/accountdetails/**

        - id: card-service
          uri: http://localhost:8009
          predicates:
            - Path=/api/cards/**

        - id: loan-service
          uri: http://localhost:8072
          predicates:
            - Path=/api/loan/**

